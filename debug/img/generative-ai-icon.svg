<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Input box -->
  <rect x="2" y="20" width="22" height="24" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <!-- Input text lines -->
  <line x1="6"  y1="28" x2="20" y2="28" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
  <line x1="6"  y1="34" x2="16" y2="34" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
  <!-- Arrow -->
  <line x1="24" y1="32" x2="36" y2="32" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="32,27 37,32 32,37" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Main sparkle star (large) -->
  <polygon points="50,4 53,16 64,19 53,22 50,34 47,22 36,19 47,16" fill="#2DD4BF"/>
  <!-- Secondary sparkle (medium) -->
  <polygon points="40,40 42,47 49,49 42,51 40,58 38,51 31,49 38,47" fill="#7C3AED" opacity="0.85"/>
  <!-- Tiny dot -->
  <circle cx="60" cy="44" r="3" fill="#2DD4BF" opacity="0.7"/>
</svg>

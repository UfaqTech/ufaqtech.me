<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e59cc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#25d6ff" stop-opacity="0.02"/>
    </linearGradient>
    
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070B2D"/>
      <stop offset="100%" stop-color="#1E59CC"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E59CC"/>
      <stop offset="100%" stop-color="#25D6FF"/>
    </linearGradient>

    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#070B2D"/>
    </linearGradient>
    
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#070b2d" flood-opacity="0.12"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#25d6ff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Background Shapes -->
  <circle cx="400" cy="300" r="260" fill="url(#bgGlow)"/>
  <circle cx="650" cy="120" r="6" fill="#25D6FF" opacity="0.6"/>
  <circle cx="150" cy="480" r="8" fill="#1E59CC" opacity="0.4"/>
  <path d="M 120,160 L 130,175 L 110,175 Z" fill="#25D6FF" opacity="0.5"/>
  <path d="M 680,420 L 690,435 L 670,435 Z" fill="#1E59CC" opacity="0.5"/>

  <!-- Main Monitor Framework -->
  <g filter="url(#shadow)">
    <!-- Base & Stand -->
    <rect x="340" y="470" width="120" height="45" rx="6" fill="#cbd5e1"/>
    <path d="M 320,515 L 480,515 L 495,535 L 305,535 Z" fill="#94a3b8"/>

    <!-- Monitor Outer Frame -->
    <rect x="140" y="80" width="520" height="400" rx="20" fill="#070B2D"/>
    <rect x="152" y="92" width="496" height="340" rx="12" fill="url(#screenGrad)"/>
    <!-- Camera Dot -->
    <circle cx="400" cy="86" r="3" fill="#64748b"/>
    <!-- Bottom Monitor Bar -->
    <rect x="140" y="432" width="520" height="48" rx="0" fill="#0f172a"/>
    <circle cx="400" cy="456" r="6" fill="#1E59CC"/>
  </g>

  <!-- Screen Content: Browser UI -->
  <!-- Browser Header -->
  <path d="M 152,104 C 152,97 157,92 164,92 L 636,92 C 643,92 648,97 648,104 L 648,128 L 152,128 Z" fill="#e2e8f0"/>
  <circle cx="174" cy="110" r="4.5" fill="#ef4444"/>
  <circle cx="188" cy="110" r="4.5" fill="#eab308"/>
  <circle cx="202" cy="110" r="4.5" fill="#22c55e"/>

  <!-- Search Engine Bar -->
  <g filter="url(#shadow)">
    <rect x="220" y="146" width="360" height="44" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Magnifying Glass -->
    <circle cx="244" cy="168" r="8" fill="none" stroke="#1E59CC" stroke-width="3"/>
    <line x1="250" y1="174" x2="258" y2="182" stroke="#1E59CC" stroke-width="3" stroke-linecap="round"/>
    <!-- Search Text -->
    <text x="272" y="173" font-family="Montserrat, sans-serif" font-size="14" font-weight="800" fill="#070B2D" letter-spacing="1">OPTIMIZE RANKINGS</text>
    <!-- Search Button -->
    <rect x="490" y="150" width="84" height="36" rx="18" fill="url(#accentGrad)"/>
    <text x="532" y="172" font-family="Montserrat, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">SEARCH</text>
  </g>

  <!-- Analytics Chart Area -->
  <!-- Grid Lines -->
  <line x1="190" y1="230" x2="440" y2="230" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="190" y1="280" x2="440" y2="280" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="190" y1="330" x2="440" y2="330" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="190" y1="380" x2="440" y2="380" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Bar Charts -->
  <rect x="210" y="310" width="24" height="70" rx="4" fill="#93c5fd"/>
  <rect x="250" y="270" width="24" height="110" rx="4" fill="#3b82f6"/>
  <rect x="290" y="240" width="24" height="140" rx="4" fill="#1d4ed8"/>
  <rect x="330" y="210" width="24" height="170" rx="4" fill="#1e40af"/>
  <rect x="370" y="180" width="24" height="200" rx="4" fill="url(#accentGrad)"/>

  <!-- Growth Trend Polyline -->
  <path d="M 200,340 L 250,300 L 290,260 L 340,220 L 400,165" fill="none" stroke="#25D6FF" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="400" cy="165" r="6" fill="#ffffff" stroke="#1E59CC" stroke-width="3"/>

  <!-- Badge 1: Top Organic Ranking -->
  <g filter="url(#shadow)">
    <rect x="470" y="210" width="155" height="60" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="496" cy="240" r="16" fill="rgba(37,99,235,0.1)"/>
    <path d="M 491,240 L 495,244 L 503,235" fill="none" stroke="#1E59CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="522" y="235" font-family="Montserrat, sans-serif" font-size="10" font-weight="700" fill="#64748b">SERP RANKING</text>
    <text x="522" y="252" font-family="Montserrat, sans-serif" font-size="14" font-weight="900" fill="#070B2D">#1 POSITION</text>
  </g>

  <!-- Badge 2: Organic Traffic -->
  <g filter="url(#shadow)">
    <rect x="470" y="290" width="155" height="60" rx="14" fill="#070B2D"/>
    <circle cx="496" cy="320" r="16" fill="rgba(37,214,255,0.15)"/>
    <path d="M 488,324 L 494,316 L 499,320 L 505,313" fill="none" stroke="#25D6FF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="522" y="315" font-family="Montserrat, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">ORGANIC TRAFFIC</text>
    <text x="522" y="332" font-family="Montserrat, sans-serif" font-size="14" font-weight="900" fill="#25D6FF">+340% GROWTH</text>
  </g>

  <!-- Rocket Illustration (Targeting & Growth) -->
  <g transform="translate(100, 190) rotate(-15)" filter="url(#glow)">
    <!-- Flame -->
    <path d="M -25,18 C -40,18 -55,12 -70,25 C -55,0 -40,-6 -25,-6 Z" fill="url(#flameGrad)"/>
    <path d="M -25,10 C -35,10 -45,6 -55,14 C -45,0 -35,-3 -25,-3 Z" fill="#ffeb3b"/>
    <!-- Rocket Body -->
    <path d="M 35,6 C 20,-18 -10,-14 -30,-6 L -30,18 C -10,26 20,22 35,6 Z" fill="#ffffff" stroke="#070B2D" stroke-width="3"/>
    <path d="M 35,6 C 20,-18 5,-14 -5,-6 L -5,18 C 5,26 20,22 35,6 Z" fill="url(#rocketGrad)"/>
    <!-- Nose Cone -->
    <path d="M 35,6 C 48,6 60,6 70,6 C 55,-6 42,-6 35,6 Z" fill="#25D6FF"/>
    <!-- Window -->
    <circle cx="15" cy="6" r="9" fill="#ffffff" stroke="#070B2D" stroke-width="3"/>
    <circle cx="15" cy="6" r="5" fill="#25D6FF"/>
    <!-- Fins -->
    <path d="M -15,-10 L -30,-25 L -25,-5 Z" fill="#1E59CC" stroke="#070B2D" stroke-width="2"/>
    <path d="M -15,22 L -30,37 L -25,17 Z" fill="#1E59CC" stroke="#070B2D" stroke-width="2"/>
  </g>

  <!-- Bullseye Target & Gear Icon -->
  <g transform="translate(620, 110)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#1E59CC" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ef4444" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#1E59CC" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#ef4444"/>
  </g>
</svg>

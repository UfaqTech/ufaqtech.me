<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Grid lines (subtle) -->
  <line x1="20" y1="10" x2="20" y2="54" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="34" y1="10" x2="34" y2="54" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="48" y1="10" x2="48" y2="54" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="8"  y1="20" x2="60" y2="20" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="8"  y1="34" x2="60" y2="34" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="8"  y1="48" x2="60" y2="48" stroke="#E5E7EB" stroke-width="1"/>
  <!-- Axes -->
  <line x1="8" y1="56" x2="60" y2="56" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="8"  x2="8"  y2="56" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Historical line (solid purple) -->
  <polyline points="12,50 20,42 30,34 40,22 48,16" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data points on historical line -->
  <circle cx="12" cy="50" r="3.5" fill="#7C3AED"/>
  <circle cx="20" cy="42" r="3.5" fill="#7C3AED"/>
  <circle cx="30" cy="34" r="3.5" fill="#7C3AED"/>
  <circle cx="40" cy="22" r="3.5" fill="#7C3AED"/>
  <circle cx="48" cy="16" r="3.5" fill="#7C3AED"/>
  <!-- Prediction line (dashed cyan) -->
  <polyline points="48,16 56,10 62,6" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,3"/>
  <!-- Prediction endpoint -->
  <circle cx="62" cy="6" r="3.5" fill="#2DD4BF"/>
  <!-- Confidence band -->
  <path d="M48,16 C52,12 58,8 62,6 L62,10 C58,12 52,16 48,20 Z" fill="#2DD4BF" opacity="0.15"/>
</svg>
